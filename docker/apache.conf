ServerName localhost
AcceptPathInfo On
RemoteIPHeader X-Forwarded-For
<Directory /var/www/html/public>
    AllowOverride None
    Require all granted
    # Moodle 5.x router: unknown paths go to r.php
    FallbackResource /r.php
</Directory>
# Don't serve internal/dev files
<FilesMatch "\.(inc|dist|lock)$">
    Require all denied
</FilesMatch>
<Files "environment.xml">
    Require all denied
</Files>
